name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      git_sha:
        description: Commit SHA to deploy (defaults to main)
        required: false

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: eu-west-3
      ECR_REPOSITORY: zentrum-production
      LIGHTSAIL_HOST: 13.36.150.163

    steps:
      - name: Resolve release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.git_sha }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="${MANUAL_SHA:-${GITHUB_SHA}}"
          else
            SHA="$TESTED_SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.release.outputs.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy, migrate and verify
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.release.outputs.sha }}
        run: |
          trap 'rm -f lightsail.pem' EXIT

          aws lightsail download-default-key-pair \
            --region "$AWS_REGION" \
            --query privateKeyBase64 \
            --output text > lightsail.pem
          chmod 600 lightsail.pem

          aws ecr get-login-password --region "$AWS_REGION" \
            | ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=accept-new \
              -i lightsail.pem \
              "ubuntu@${LIGHTSAIL_HOST}" \
              "sudo docker login --username AWS --password-stdin '${{ steps.login-ecr.outputs.registry }}'"

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            -i lightsail.pem \
            "ubuntu@${LIGHTSAIL_HOST}" \
            "bash -s -- '$IMAGE_URI'" \
            < scripts/deploy-lightsail.sh
