name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        type: choice
        options: [plan, apply]
        default: plan
      certificate_arn:
        description: Validated ACM certificate ARN
        required: true
      image_tag:
        description: Initial immutable image tag
        required: false
        default: bootstrap

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: infrastructure
    env:
      AWS_REGION: eu-west-3
      TF_IN_AUTOMATION: 'true'
      TF_VAR_certificate_arn: ${{ inputs.certificate_arn }}
      TF_VAR_image_tag: ${{ inputs.image_tag }}
      TF_VAR_app_secret_values: ${{ secrets.TF_APP_SECRET_VALUES }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Initialize Terraform
        working-directory: infra/terraform
        run: >-
          terraform init
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=zentrum/production.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="encrypt=true"

      - name: Validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Create container registry first
        if: inputs.action == 'apply'
        working-directory: infra/terraform
        run: terraform apply -target=aws_ecr_repository.app -auto-approve

      - id: login-ecr
        if: inputs.action == 'apply'
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3
        if: inputs.action == 'apply'

      - name: Publish initial application image
        if: inputs.action == 'apply'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/zentrum-production:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Plan
        working-directory: infra/terraform
        run: terraform plan -out=tfplan

      - name: Apply
        if: inputs.action == 'apply'
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan
