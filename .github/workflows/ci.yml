name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_MODE: sandbox
      DB_HOST_SANDBOX: 127.0.0.1
      DB_PORT_SANDBOX: 3306
      DB_DATABASE_SANDBOX: zentrumtask_test
      DB_USERNAME_SANDBOX: root
      DB_PASSWORD_SANDBOX: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: zentrumtask_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, exif, gd, intl, pdo_mysql, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: |
          vendor/bin/pint --dirty
          git diff --exit-code -- app config database routes tests

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run test suite
        run: php -d memory_limit=512M vendor/bin/pest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zentrumtask:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Validate formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate infrastructure
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
